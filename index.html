<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prospect Pipeline · Stoll Industries</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root, body[data-theme="dark"] {
    --bg: #1C1A1B;
    --surface: #262324;
    --surface-alt: #1C1A1B;
    --border: #3A3536;
    --border-soft: #2E2A2B;
    --badge-border: #4A4546;
    --text: #F4F1EF;
    --text-secondary: #A9A0A0;
    --text-muted: #7A7274;
    --text-dim: #DCD6D6;
    --placeholder: #726A6C;
  }
  body[data-theme="gray"] {
    --bg: #484546;
    --surface: #565355;
    --surface-alt: #403D3E;
    --border: #6A6668;
    --border-soft: #5C595B;
    --badge-border: #6A6668;
    --text: #F2EFEE;
    --text-secondary: #C7C1C2;
    --text-muted: #A29C9D;
    --text-dim: #DAD5D4;
    --placeholder: #9C9697;
  }
  body[data-theme="light"] {
    --bg: #F7F3F1;
    --surface: #FFFFFF;
    --surface-alt: #F1ECEA;
    --border: #DDD4D1;
    --border-soft: #E8E2E0;
    --badge-border: #D2C7C4;
    --text: #231F20;
    --text-secondary: #5C5556;
    --text-muted: #8A8283;
    --text-dim: #3A3536;
    --placeholder: #A39B9A;
  }

  body {
    background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
    padding: 28px 20px 60px; min-height: 100vh;
  }
  input, select, textarea, button { font-family: 'Inter', sans-serif; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid #9F1C34; outline-offset: 1px; }
  ::placeholder { color: var(--placeholder); }
  a { color: inherit; }
  .page { max-width: 920px; margin: 0 auto; }
  .header-title-row { display: flex; align-items: center; gap: 9px; }
  .title { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 25px; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 4px 0 0 31px; }
  .shared-notice { color: var(--text-muted); font-size: 11.5px; margin: 5px 0 0 31px; font-style: italic; }
  .backup-row { display: flex; gap: 8px; margin: 12px 0 0 31px; flex-wrap: wrap; }
  .backup-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .tab-bar { display: flex; align-items: center; gap: 8px; margin: 20px 0 14px; flex-wrap: wrap; }
  .tab-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 14px;
    border-radius: 7px; font-size: 13.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 7px;
  }
  .tab-btn.active { background: var(--surface); color: var(--text); border-color: #9F1C34; }
  .tab-count { background: var(--border); padding: 1px 7px; border-radius: 20px; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .spacer { flex: 1; }
  .settings-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 10px;
    border-radius: 7px; cursor: pointer; display: flex; align-items: center;
  }
  .settings-btn.active { background: var(--surface); color: var(--text); border-color: #9F1C34; }
  .sort-select { width: auto; max-width: 220px; }
  .add-btn {
    background: #9F1C34; color: #F4F1EF; border: none; border-radius: 7px; padding: 8px 14px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .add-form { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .input, select.input {
    background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 9px; font-size: 13.5px;
  }
  .btn-primary {
    background: #9F1C34; color: #F4F1EF; border: none; border-radius: 6px; padding: 8px 12px;
    font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-ghost {
    background: transparent; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 13px; cursor: pointer;
  }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card-bar { width: 5px; flex-shrink: 0; }
  .card-body { flex: 1; min-width: 0; }
  .card-header {
    width: 100%; background: transparent; border: none; color: inherit; padding: 14px 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; flex-wrap: wrap;
  }
  .card-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .card-header-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .company-name { font-family: 'Poppins', sans-serif; font-size: 16.5px; font-weight: 600; }
  .badge { font-size: 11.5px; border: 1px solid var(--badge-border); color: var(--text-secondary); border-radius: 20px; padding: 2px 9px; white-space: nowrap; }
  .dollar-badge { font-size: 11.5px; color: #3E5A48; background: rgba(62,90,72,0.15); border-radius: 20px; padding: 2px 9px; white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-weight: 500; }
  .next-contact { font-size: 12.5px; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 5px; }
  .overdue { color: #9F1C34; }
  .chevron { transition: transform 0.15s; }
  .chevron.open { transform: rotate(180deg); }
  .detail { padding: 4px 16px 16px; border-top: 1px solid var(--border); }
  .detail-subtabs { display: flex; gap: 6px; margin-top: 14px; border-bottom: 1px solid var(--border); }
  .detail-subtab {
    background: none; border: none; color: var(--text-muted); font-size: 13px; font-weight: 500;
    padding: 8px 4px; cursor: pointer; border-bottom: 2px solid transparent; margin-right: 14px;
  }
  .detail-subtab.active { color: var(--text); border-bottom-color: #9F1C34; }
  .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 14px; margin-top: 4px; }
  .checkbox-pill { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); cursor: pointer; }
  .checkbox-pill input { accent-color: #9F1C34; width: 15px; height: 15px; cursor: pointer; }
  .routing-table { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .routing-row {
    display: grid; grid-template-columns: 1.4fr 1.2fr 1fr 1fr; gap: 8px; align-items: center;
  }
  .routing-head { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .routing-role { font-size: 12.5px; color: var(--text-secondary); }
  .field-grid, .contact-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .dollar-wrap { position: relative; }
  .dollar-prefix { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13.5px; pointer-events: none; }
  .textarea { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 9px; font-size: 13.5px; resize: vertical; font-family: 'Inter', sans-serif; width: 100%; }
  .section { margin-top: 18px; }
  .section-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .notes-add { display: flex; gap: 8px; align-items: flex-start; }
  .notes-list, .step-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .empty-inline { font-size: 12.5px; color: var(--text-muted); font-style: italic; }
  .note-item { background: var(--surface-alt); border: 1px solid var(--border-soft); border-radius: 6px; padding: 8px 10px; display: flex; gap: 10px; font-size: 13px; align-items: flex-start; }
  .note-item-editing { align-items: stretch; }
  .note-date { color: #9F1C34; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; flex-shrink: 0; padding-top: 1px; }
  .note-by { color: var(--text-muted); font-size: 10px; font-family: 'Inter', sans-serif; }
  .note-text { color: var(--text-dim); line-height: 1.4; flex: 1; }
  .step-item { display: flex; align-items: center; gap: 9px; background: var(--surface-alt); border: 1px solid var(--border-soft); border-radius: 6px; padding: 7px 9px; }
  .step-item.done { opacity: 0.75; }
  .step-checkbox { background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; flex-shrink: 0; }
  .step-text { flex: 1; font-size: 13.5px; }
  .step-text-input { flex: 1; font-size: 13.5px; padding: 6px 8px; }
  .step-by { font-size: 10px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
  .step-text.done { color: var(--text-secondary); text-decoration: line-through; }
  .step-done-date { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }
  .step-delete { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px; flex-shrink: 0; }
  .step-due-input { width: 132px; padding: 5px 7px; font-size: 12px; flex-shrink: 0; }
  .step-due-input.overdue { border-color: #9F1C34; color: #9F1C34; }
  .completed-toggle { background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 0; margin-top: 10px; }
  .action-row { display: flex; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .btn-won { background: #3E5A48; color: #E7F0EA; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-lost { background: #6B2430; color: #F3E1E3; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-reopen { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-delete { background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  .confirm-text { font-size: 12.5px; color: var(--text-secondary); }
  .empty { color: var(--text-muted); font-size: 13.5px; padding: 30px 0; text-align: center; }
  .save-status { max-width: 920px; margin: 16px auto 0; font-size: 12.5px; text-align: center; color: var(--text-muted); }
  .save-status.error { color: #9F1C34; }
  .retry-link { background: none; border: none; color: #9F1C34; text-decoration: underline; font-size: 12.5px; cursor: pointer; margin-left: 8px; padding: 0; }
  .import-panel { margin: 10px 0 0 31px; max-width: 500px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .import-error { color: #9F1C34; font-size: 12px; margin-top: 8px; }

  /* Passcode gate */
  .gate { max-width: 360px; margin: 18vh auto 0; text-align: center; }
  .gate .title { justify-content: center; display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .gate p { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
  .gate input { width: 100%; text-align: center; font-size: 16px; padding: 10px; letter-spacing: 2px; }
  .gate button { width: 100%; margin-top: 12px; padding: 10px; justify-content: center; }
  .gate .err { color: #9F1C34; font-size: 12.5px; margin-top: 10px; }

  /* Action Items tab */
  .action-items-groups { display: flex; flex-direction: column; gap: 26px; }
  .action-items-group { }
  .action-items-group-header {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    text-align: left; color: inherit;
  }
  .action-items-group-header:hover { border-color: #9F1C34; }

  /* Admin users */
  .user-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .user-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
  }
  .user-name { font-size: 13.5px; font-weight: 600; }
  .user-email { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* Reports tab */
  .report-list { display: flex; flex-direction: column; gap: 10px; }
  .report-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .report-card-title { font-size: 14.5px; font-weight: 600; font-family: 'Poppins', sans-serif; }
  .report-card-desc { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; max-width: 440px; }

  /* Settings */
  .settings-panel { max-width: 560px; }
  .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 10px; }
  .theme-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    cursor: pointer; text-align: left; color: var(--text);
  }
  .theme-card.selected { border-color: #9F1C34; }
  .theme-swatch { display: flex; height: 34px; border-radius: 6px; overflow: hidden; margin-bottom: 10px; border: 1px solid var(--border); }
  .theme-swatch span { flex: 1; }
  .theme-card-label { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
</style>

function emptyLegal() {
  const routing = {};
  ROUTING_ROLES.forEach((r) => { routing[r] = { name: "", reviewedDate: "", approvedDate: "" }; });
  return {
    required: "",
    stollContact: "", department: "", dateSubmitted: "", responseDate: "",
    agreementTypes: [], agreementTypeOther: "",
    otherPartyName: "", relationship: "", relationshipLength: "",
    businessPurpose: "", financialImpact: "",
    concerns: [], concernsOther: "",
    standardOrDrafted: "", negotiatingLeverage: "", strategicRelationship: "",
    otherAgreements: "", confidentialInfo: "", involvesIP: "", otherContext: "",
    routing,
    attachments: [],
  };
}
function getLegal(p) {
  const base = emptyLegal();
  const saved = p.legal || {};
  return {
    ...base, ...saved,
    routing: { ...base.routing, ...(saved.routing || {}) },
  };
}

function sortProspects(list, sortId) {
  const arr = [...list];
  const cmp = {
    nextcontact: (a, b) => (a.nextContactDate || "9999").localeCompare(b.nextContactDate || "9999"),
    lastcontact: (a, b) => (a.lastContactDate || "9999").localeCompare(b.lastContactDate || "9999"),
    name: (a, b) => (a.companyName || "").localeCompare(b.companyName || ""),
    potential: (a, b) => (POTENTIAL_ORDER[a.salesPotential] ?? 9) - (POTENTIAL_ORDER[b.salesPotential] ?? 9),
    dollar: (a, b) => (b.annualPotential || 0) - (a.annualPotential || 0),
    channel: (a, b) => (a.channel || "").localeCompare(b.channel || ""),
    launchgoal: (a, b) => (a.launchGoal || "zzzz").localeCompare(b.launchGoal || "zzzz"),
    closeddate: (a, b) => (b.closedDate || "").localeCompare(a.closedDate || ""),
  }[sortId];
  return cmp ? arr.sort(cmp) : arr;
}

function uid() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  // Fallback UUIDv4 for older browsers without crypto.randomUUID
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  if (!d) return "—";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}
function fmtCurrency(n) {
  const num = Number(n);
  if (!num) return "$0";
  return "$" + num.toLocaleString("en-US");
}
function fmtFileSize(bytes) {
  const n = Number(bytes) || 0;
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}

const MAX_UPLOAD_BYTES = 4 * 1024 * 1024;

function handleFileSelect(e, prospectId) {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  if (file.size > MAX_UPLOAD_BYTES) {
    state.fileUploadStatus[prospectId] = `"${file.name}" is over the 4MB limit.`;
    render();
    return;
  }
  state.fileUploadStatus[prospectId] = `Uploading ${file.name}…`;
  render();

  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result;
    const base64 = String(dataUrl).split(",")[1];
    try {
      const res = await api("upload-file", {
        body: { prospectId, fileName: file.name, fileType: file.type, dataBase64: base64 },
      });
      state.prospects = state.prospects.map((p) =>
        p.id === prospectId ? { ...p, attachments: [...(p.attachments || []), res.attachment] } : p
      );
      state.fileUploadStatus[prospectId] = "";
      scheduleSave();
    } catch (err) {
      state.fileUploadStatus[prospectId] = `Upload failed: ${err.message || "unknown error"}`;
      render();
    }
  };
  reader.onerror = () => {
    state.fileUploadStatus[prospectId] = "Couldn't read that file.";
    render();
  };
  reader.readAsDataURL(file);
}

async function downloadFile(path) {
  try {

}

async function deleteFile(prospectId, fileId, path) {

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentAccessToken = null;

async function api(action, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (currentAccessToken) headers["Authorization"] = `Bearer ${currentAccessToken}`;
  const res = await fetch(`${API_BASE}?action=${action}`, {
    method: opts.body ? "POST" : "GET",
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok || !data.ok) {
    const err = new Error(data.error || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

async function initAuth() {
  // If the URL carries a recovery/invite link, force the "set new password" screen
  // once a session is established, regardless of which auth event fires.
  if (/type=recovery|type=invite/.test(window.location.hash)) {
    state.forceSetPassword = true;
  }

  sb.auth.onAuthStateChange(async (event, session) => {
    currentAccessToken = session ? session.access_token : null;
    if (event === "PASSWORD_RECOVERY") {
      state.forceSetPassword = true;
      state.authenticated = false;
      render();
      return;
    }
    if (session && state.forceSetPassword) {
      state.authenticated = false;
      render();
      return;
    }
    if (session) {
      await refreshWhoAmI();
      state.authenticated = true;
      render();
      loadBoard();
    } else {
      state.authenticated = false;
      state.loaded = false;
      state.currentUser = null;
      render();
    }
  });

  try {
    const status = await api("bootstrap-status");
    state.needsBootstrap = status.needsBootstrap;
  } catch (e) {
    state.needsBootstrap = false;
  }
  render();
}

let saveTimer = null;
function scheduleSave() {
  state.saveError = "";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
  render();
}

// Used for plain field edits (text/select/date inputs). Skips the immediate
// re-render so a full DOM replacement doesn't happen mid-blur, which is what
// broke Tab-to-next-field navigation — the browser was trying to focus a
// DOM node that had just been destroyed and rebuilt.
function scheduleSaveQuiet() {
  state.saveError = "";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
}

async function doSave() {
  state.prospects = state.prospects.map((p) => (isValidUUID(p.id) ? p : { ...p, id: uid() }));
  state.saving = true;
  render();
  try {
    await api("save", { body: { prospects: state.prospects } });
    state.saving = false;
    state.saveError = "";
  } catch (e) {
    state.saving = false;
    state.saveError = e.message || "Couldn't save changes.";
  }
  render();
}

}

function generateProspectPDF(prospectId) {
  const p = state.prospects.find((x) => x.id === prospectId);
  if (!p) return;
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("PDF library didn't load — check your internet connection and try again.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 48;
  const contentWidth = pageWidth - margin * 2;
  const crimson = [159, 28, 52];
  const charcoal = [35, 31, 32];
  const gray = [110, 104, 105];
  const lightGray = [230, 224, 222];
  let y = 0;

  function newPageIfNeeded(need) {
    if (y + need > pageHeight - 56) {
      addFooter();
      doc.addPage();
      y = margin;
    }
  }

  function addFooter() {
    const pageNum = doc.internal.getCurrentPageInfo().pageNumber;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(...gray);
    doc.text("Stoll Industries — Prospect Pipeline", margin, pageHeight - 28);
    doc.text(`Generated ${fmtDate(todayISO())}`, pageWidth - margin, pageHeight - 28, { align: "right" });
    doc.text(String(pageNum), pageWidth / 2, pageHeight - 28, { align: "center" });
  }

  function sectionLabel(text) {
    newPageIfNeeded(28);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(...crimson);
    doc.text(text.toUpperCase(), margin, y);
    doc.setDrawColor(...lightGray);
    doc.setLineWidth(0.75);
    doc.line(margin, y + 5, pageWidth - margin, y + 5);
    y += 20;
  }

  function fieldRow(pairs) {
    // pairs: array of [label, value], rendered in a 2-column grid
    const colWidth = contentWidth / 2;
    let rowY = y;
    pairs.forEach((pair, i) => {
      const col = i % 2;
      const x = margin + col * colWidth;
      if (col === 0 && i > 0) rowY += 32;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.setTextColor(...gray);
      doc.text(pair[0].toUpperCase(), x, rowY);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.setTextColor(...charcoal);
      doc.text(pair[1] || "—", x, rowY + 15);
    });
    y = rowY + 32;
  }

  function paragraph(text, size = 10) {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(size);
    doc.setTextColor(...charcoal);
    const lines = doc.splitTextToSize(text, contentWidth);
    lines.forEach((line) => {
      newPageIfNeeded(16);
      doc.text(line, margin, y);
      y += 14;
    });
  }

  // --- Header with logo ---
  try {
    doc.addImage(STOLL_LOGO_BASE64, "PNG", margin, 36, 145, 29.5);
  } catch (e) { /* logo optional */ }
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(...gray);
  doc.text("PROSPECT OVERVIEW", pageWidth - margin, 46, { align: "right" });
  doc.setFontSize(8.5);
  doc.text(`Generated ${fmtDate(todayISO())}`, pageWidth - margin, 58, { align: "right" });
  doc.setDrawColor(...crimson);
  doc.setLineWidth(2);
  doc.line(margin, 82, pageWidth - margin, 82);
  y = 112;

  // --- Company name + badges ---
  doc.setFont("helvetica", "bold");
  doc.setFontSize(20);
  doc.setTextColor(...charcoal);
  doc.text(p.companyName || "Untitled Prospect", margin, y);
  y += 20;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10.5);
  doc.setTextColor(...gray);
  const statusLabel = STATUS_LABEL[p.status] || p.status;
  const locLine = [p.city, p.state].filter(Boolean).join(", ");
  doc.text([p.channel, statusLabel, locLine].filter(Boolean).join("   ·   "), margin, y);
  y += 28;

  // --- Key fields ---
  sectionLabel("Key Details");
  fieldRow([
    ["Sales Potential", p.salesPotential],
    ["Sales $ / Year", p.annualPotential ? fmtCurrency(p.annualPotential) : "—"],
    ["Launch Goal", p.launchGoal],
    ["Sales Rep", p.salesRep],
    ["Last Contact", fmtDate(p.lastContactDate)],
    ["Next Contact", fmtDate(p.nextContactDate)],
    ["Setup in EBMS", p.ebmsSetup],
    ["Closed Date", p.status !== "active" ? fmtDate(p.closedDate) : "—"],
  ]);
  y += 6;

  // --- Company overview ---
  if (p.companyOverview) {
    sectionLabel("Company Overview");
    paragraph(p.companyOverview);
    y += 10;
  }

  // --- Primary contact ---
  sectionLabel("Primary Contact");
  fieldRow([
    ["Name", p.primaryContact.name],
    ["Phone", p.primaryContact.phone],
    ["Email", p.primaryContact.email],
    ["", ""],
  ]);
  y += 6;

  // --- Action items ---
  const openSteps = (p.actionSteps || []).filter((s) => !s.done);
  const doneSteps = (p.actionSteps || []).filter((s) => s.done);
  if (openSteps.length > 0 || doneSteps.length > 0) {
    sectionLabel(`Action Items (${openSteps.length} open, ${doneSteps.length} completed)`);
    openSteps
      .sort((a, b) => (a.dueDate || "9999").localeCompare(b.dueDate || "9999"))
      .forEach((s) => {
        newPageIfNeeded(16);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.setTextColor(...charcoal);
        const due = s.dueDate ? `  (due ${fmtDate(s.dueDate)})` : "";
        doc.text(`☐  ${s.text}${due}`, margin, y);
        y += 16;
      });
    doneSteps.forEach((s) => {
      newPageIfNeeded(16);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor(...gray);
      doc.text(`☑  ${s.text}  (done ${fmtDate(s.doneDate)})`, margin, y);
      y += 16;
    });
    y += 10;
  }

  // --- Notes ---
  if ((p.notes || []).length > 0) {
    sectionLabel("Notes");
    p.notes.forEach((n) => {
      newPageIfNeeded(30);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.5);
      doc.setTextColor(...crimson);
      doc.text(fmtDate(n.date), margin, y);
      y += 13;
      paragraph(n.text, 10);
      y += 8;
    });
  }

  addFooter();
  const safeName = (p.companyName || "prospect").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  doc.save(`${safeName}-overview-${todayISO()}.pdf`);
}

function handleFileImport(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => applyImport(reader.result);
  reader.readAsText(file);
  e.target.value = "";
}
function isValidUUID(s) {
  return typeof s === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s);
}
function applyImport(text) {
  try {
    const parsed = JSON.parse(text);
    if (!Array.isArray(parsed)) throw new Error("File doesn't contain a list of prospects.");
    state.prospects = parsed.map((p) => (isValidUUID(p.id) ? p : { ...p, id: uid() }));
    state.showImport = false; state.importText = ""; state.importError = "";
    scheduleSave();
  } catch (e) {
    state.importError = e.message || "Couldn't read that file.";
    render();
  }
}

  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

            <select class="input" onchange="updateProspect('${p.id}', {channel: this.value})">
              ${CHANNELS.map((c) => `<option value="${esc(c)}" ${p.channel === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label class="field-label">Launch Goal</label>
            <input class="input" placeholder="e.g. Q4 2026" value="${esc(p.launchGoal)}"
              onchange="updateProspect('${p.id}', {launchGoal: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">Last Contact</label>
            <input class="input" type="date" value="${p.lastContactDate || ""}"
              onchange="updateProspect('${p.id}', {lastContactDate: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">Next Contact</label>
            <input class="input" type="date" value="${p.nextContactDate || ""}"
              onchange="updateProspect('${p.id}', {nextContactDate: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">Sales Rep</label>
            <input class="input" placeholder="Rep name" value="${esc(p.salesRep || "")}"
              onchange="updateProspect('${p.id}', {salesRep: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">City</label>
            <input class="input" placeholder="City" value="${esc(p.city || "")}"
              onchange="updateProspect('${p.id}', {city: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">State</label>
            <input class="input" placeholder="State" value="${esc(p.state || "")}"
              onchange="updateProspect('${p.id}', {state: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">Setup in EBMS</label>
            <select class="input" onchange="updateProspect('${p.id}', {ebmsSetup: this.value})">
              <option value="" ${!p.ebmsSetup ? "selected" : ""}></option>
              <option value="Yes" ${p.ebmsSetup === "Yes" ? "selected" : ""}>Yes</option>
              <option value="No" ${p.ebmsSetup === "No" ? "selected" : ""}>No</option>
            </select>
          </div>
        </div>

        <div class="contact-row">
          <div class="field">
            <label class="field-label">Primary Contact</label>
            <input class="input" placeholder="Name" value="${esc(p.primaryContact.name)}"
              onchange="updateContact('${p.id}', {name: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">Phone</label>
            <input class="input" placeholder="Phone" value="${esc(p.primaryContact.phone)}"
              onchange="updateContact('${p.id}', {phone: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">Email</label>
            <input class="input" placeholder="Email" value="${esc(p.primaryContact.email)}"
              onchange="updateContact('${p.id}', {email: this.value})" />
          </div>
        </div>
        ` : state.detailTab[p.id] === "activity" ? `
        <div class="section" style="margin-top:14px">
          <div class="section-label">Action Steps</div>
          <div class="notes-add">
            <input class="input" style="flex:1" placeholder="Add an action step…"
              value="${esc(state.stepDraft[p.id] || "")}"
              oninput="state.stepDraft['${p.id}'] = this.value"
              onkeydown="if(event.key==='Enter'){addActionStep('${p.id}')}" />
            <input class="input" type="date" title="Due date (optional)" style="width:150px"
              value="${state.stepDueDraft[p.id] || ""}"
              oninput="state.stepDueDraft['${p.id}'] = this.value" />
            <button class="btn-primary" onclick="addActionStep('${p.id}')">${ICONS.plus} Add</button>
          </div>
          <div class="step-list">
            ${open.length === 0 && done.length === 0 ? `<div class="empty-inline">No action steps yet.</div>` : ""}
            ${open.map((s) => {
              const overdueStep = s.dueDate && s.dueDate < todayISO();
              return `
              <div class="step-item">
                <button class="step-checkbox" onclick="toggleActionStep('${p.id}','${s.id}')">${ICONS.square}</button>
                <input class="input step-text-input" value="${esc(s.text)}"
                  onchange="updateActionStepText('${p.id}','${s.id}', this.value)" />
                ${s.addedBy ? `<span class="step-by" title="Added by ${esc(s.addedBy)}">${esc(s.addedBy)}</span>` : ""}
                <input class="input step-due-input ${overdueStep ? "overdue" : ""}" type="date" title="Due date"
                  value="${s.dueDate || ""}"
                  onchange="updateActionStepDueDate('${p.id}','${s.id}', this.value)" />
                <button class="step-delete" onclick="deleteActionStep('${p.id}','${s.id}')">${ICONS.x}</button>
              </div>
            `;
            }).join("")}
          </div>
          ${done.length > 0 ? `
            <button class="completed-toggle" onclick="state.showCompleted['${p.id}'] = !state.showCompleted['${p.id}']; render()">
              <span class="chevron ${showCompleted ? "open" : ""}">${ICONS.chevron}</span> Completed (${done.length})
            </button>
            ${showCompleted ? `
              <div class="step-list" style="margin-top:6px">
                ${done.map((s) => `
                  <div class="step-item done">
                    <button class="step-checkbox" onclick="toggleActionStep('${p.id}','${s.id}')">${ICONS.checksquare}</button>
                    <span class="step-text done">${esc(s.text)}</span>
                    <span class="step-done-date">${fmtDate(s.doneDate)}</span>
                    <button class="step-delete" onclick="deleteActionStep('${p.id}','${s.id}')">${ICONS.x}</button>
                  </div>
                `).join("")}
              </div>
            ` : ""}
          ` : ""}
        </div>

        <div class="section">
          <div class="section-label">Notes</div>
          <div class="notes-add">
            <textarea class="textarea" rows="2" placeholder="Add a note…"
              oninput="state.noteDraft['${p.id}'] = this.value">${esc(state.noteDraft[p.id] || "")}</textarea>
            <button class="btn-primary" onclick="addNote('${p.id}')">${ICONS.plus} Add</button>
          </div>
          <div class="notes-list">
            ${p.notes.length === 0 ? `<div class="empty-inline">No notes yet.</div>` : ""}
            ${p.notes.map((n) => state.editingNoteId === n.id ? `
              <div class="note-item note-item-editing">
                <div style="flex:1;display:flex;flex-direction:column;gap:6px">
                  <span class="note-date">${fmtDate(n.date)}</span>
                  <textarea class="textarea" rows="2"
                    oninput="state.noteEditDraft['${n.id}'] = this.value">${esc(state.noteEditDraft[n.id] ?? n.text)}</textarea>
                  <div style="display:flex;gap:8px">
                    <button class="btn-primary" onclick="saveEditNote('${p.id}','${n.id}')">${ICONS.check} Save</button>
                    <button class="btn-ghost" onclick="cancelEditNote()">Cancel</button>
                  </div>
                </div>
              </div>
            ` : `
              <div class="note-item">
                <span class="note-date">${fmtDate(n.date)}${n.addedBy ? `<br><span class="note-by">${esc(n.addedBy)}</span>` : ""}</span>
                <span class="note-text">${esc(n.text)}</span>
                <button class="step-delete" title="Edit note" onclick="startEditNote('${p.id}','${n.id}')">${ICONS.pencil}</button>
                <button class="step-delete" title="Delete note" onclick="deleteNote('${p.id}','${n.id}')">${ICONS.x}</button>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="section">
          <div class="section-label">Files</div>
          <div class="notes-add">
            <input class="input" type="file" style="flex:1"
              onchange="handleFileSelect(event, '${p.id}')" />
          </div>
          <div class="notes-list">
            ${state.fileUploadStatus[p.id] ? `<div class="empty-inline">${esc(state.fileUploadStatus[p.id])}</div>` : ""}
            ${(p.attachments || []).length === 0 && !state.fileUploadStatus[p.id] ? `<div class="empty-inline">No files yet.</div>` : ""}
            ${(p.attachments || []).map((f) => `
              <div class="note-item">
                <span class="note-text" style="flex:1">
                  ${esc(f.name)} <span style="color:#7A7274;font-size:11px">(${fmtFileSize(f.size)} · ${fmtDate(f.uploadedDate)})</span>
                </span>
                <button class="backup-btn" style="padding:4px 8px" onclick="downloadFile('${f.path}')">${ICONS.download}</button>
                <button class="step-delete" onclick="deleteFile('${p.id}','${f.id}','${f.path}')">${ICONS.x}</button>
              </div>
            `).join("")}
          </div>
        </div>
        ` : `
        <div class="action-row" style="margin-top:14px">
          <button class="btn-ghost" onclick="generateLegalPDF('${p.id}')">${ICONS.download} Legal Review PDF</button>
        </div>

        <div class="field-grid" style="margin-top:18px">
          <div class="field">
            <label class="field-label">Stoll Contact</label>
            <input class="input" value="${esc(legal.stollContact)}" onchange="updateLegal('${p.id}', {stollContact: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">Department</label>
            <input class="input" value="${esc(legal.department)}" onchange="updateLegal('${p.id}', {department: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">Date Submitted</label>
            <input class="input" type="date" value="${legal.dateSubmitted}" onchange="updateLegal('${p.id}', {dateSubmitted: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">Requested Response Date</label>
            <input class="input" type="date" value="${legal.responseDate}" onchange="updateLegal('${p.id}', {responseDate: this.value})" />
          </div>
        </div>

        <div class="section">
          <div class="section-label">Agreement Type</div>
          <div class="checkbox-grid">
            ${AGREEMENT_TYPES.map((t) => `
              <label class="checkbox-pill">
                <input type="checkbox" ${legal.agreementTypes.includes(t) ? "checked" : ""}
                  onchange="toggleLegalListValue('${p.id}','agreementTypes','${t}')" /> ${esc(t)}
              </label>
            `).join("")}
          </div>
          ${legal.agreementTypes.includes("Other") ? `
            <input class="input" style="margin-top:8px" placeholder="Describe other agreement type"
              value="${esc(legal.agreementTypeOther)}" onchange="updateLegal('${p.id}', {agreementTypeOther: this.value})" />
          ` : ""}
        </div>

        <div class="field-grid">
          <div class="field">
            <label class="field-label">Name of Other Party to Agreement</label>
            <input class="input" value="${esc(legal.otherPartyName)}" onchange="updateLegal('${p.id}', {otherPartyName: this.value})" />
          </div>
          <div class="field">
            <label class="field-label">Relationship</label>
            <select class="input" onchange="updateLegal('${p.id}', {relationship: this.value})">
              <option value="" ${!legal.relationship ? "selected" : ""}></option>
              <option value="New" ${legal.relationship === "New" ? "selected" : ""}>New</option>
              <option value="Existing" ${legal.relationship === "Existing" ? "selected" : ""}>Existing</option>
              <option value="Renewal" ${legal.relationship === "Renewal" ? "selected" : ""}>Renewal</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label">Length of Relationship</label>
            <input class="input" value="${esc(legal.relationshipLength)}" onchange="updateLegal('${p.id}', {relationshipLength: this.value})" />
          </div>
        </div>

        <div class="section">
          <div class="section-label">Business Purpose</div>
          <div class="empty-inline" style="margin-bottom:6px">Briefly describe the business relationship and why this agreement is needed.</div>
          <textarea class="textarea" rows="3" onchange="updateLegal('${p.id}', {businessPurpose: this.value})">${esc(legal.businessPurpose)}</textarea>
        </div>

        <div class="section">
          <div class="section-label">Financial Impact</div>
          <div class="empty-inline" style="margin-bottom:6px">Estimated annual revenue or purchases, strategic product expansion, etc.</div>
          <textarea class="textarea" rows="3" onchange="updateLegal('${p.id}', {financialImpact: this.value})">${esc(legal.financialImpact)}</textarea>
        </div>

        <div class="section">
          <div class="section-label">Items of Particular Concern</div>
          <div class="checkbox-grid">
            ${LEGAL_CONCERNS.map((c) => `
              <label class="checkbox-pill">
                <input type="checkbox" ${legal.concerns.includes(c) ? "checked" : ""}
                  onchange="toggleLegalListValue('${p.id}','concerns','${c}')" /> ${esc(c)}
              </label>
            `).join("")}
          </div>
          ${legal.concerns.includes("Other") ? `
            <input class="input" style="margin-top:8px" placeholder="Describe other concerns"
              value="${esc(legal.concernsOther)}" onchange="updateLegal('${p.id}', {concernsOther: this.value})" />
          ` : ""}
        </div>

        <div class="section">
          <div class="section-label">Supplemental Questions for Context</div>
          <div class="field-grid" style="margin-top:0">
            <div class="field">
              <label class="field-label">Standard company agreement, or drafted by other party?</label>
              <input class="input" value="${esc(legal.standardOrDrafted)}" onchange="updateLegal('${p.id}', {standardOrDrafted: this.value})" />
            </div>
            <div class="field">
              <label class="field-label">Who has the negotiating leverage?</label>
              <input class="input" value="${esc(legal.negotiatingLeverage)}" onchange="updateLegal('${p.id}', {negotiatingLeverage: this.value})" />
            </div>
            <div class="field">
              <label class="field-label">Is this a strategic relationship?</label>
              <input class="input" value="${esc(legal.strategicRelationship)}" onchange="updateLegal('${p.id}', {strategicRelationship: this.value})" />
            </div>
            <div class="field">
              <label class="field-label">Any other agreements with this company?</label>
              <input class="input" value="${esc(legal.otherAgreements)}" onchange="updateLegal('${p.id}', {otherAgreements: this.value})" />
            </div>
            <div class="field">
              <label class="field-label">Will confidential information be exchanged?</label>
              <input class="input" value="${esc(legal.confidentialInfo)}" onchange="updateLegal('${p.id}', {confidentialInfo: this.value})" />
            </div>
            <div class="field">
              <label class="field-label">Involves software, data, or IP?</label>
              <input class="input" value="${esc(legal.involvesIP)}" onchange="updateLegal('${p.id}', {involvesIP: this.value})" />
            </div>
          </div>
          <div class="field" style="margin-top:12px">
            <label class="field-label">Any other elements to note for context?</label>
            <textarea class="textarea" rows="2" onchange="updateLegal('${p.id}', {otherContext: this.value})">${esc(legal.otherContext)}</textarea>
          </div>
        </div>

        <div class="section">
          <div class="section-label">Legal Review Routing &amp; Approval Matrix</div>
          <div class="routing-table">
            <div class="routing-row routing-head">
              <div>Responsible Party</div><div>Name</div><div>Reviewed Draft Date</div><div>Approved Final Version Date</div>
            </div>
            ${ROUTING_ROLES.map((role) => `
              <div class="routing-row">
                <div class="routing-role">${esc(role)}</div>
                <input class="input" value="${esc(legal.routing[role].name)}"
                  onchange="updateLegalRouting('${p.id}','${role}', {name: this.value})" />
                <input class="input" type="date" value="${legal.routing[role].reviewedDate}"
                  onchange="updateLegalRouting('${p.id}','${role}', {reviewedDate: this.value})" />
                <input class="input" type="date" value="${legal.routing[role].approvedDate}"
                  onchange="updateLegalRouting('${p.id}','${role}', {approvedDate: this.value})" />
              </div>
            `).join("")}
          </div>
        </div>

        <div class="section">
          <div class="section-label">Files</div>
          <div class="notes-add">
            <input class="input" type="file" style="flex:1"
              onchange="handleLegalFileSelect(event, '${p.id}')" />
          </div>
          <div class="notes-list">
            ${state.legalFileUploadStatus[p.id] ? `<div class="empty-inline">${esc(state.legalFileUploadStatus[p.id])}</div>` : ""}
            ${(legal.attachments || []).length === 0 && !state.legalFileUploadStatus[p.id] ? `<div class="empty-inline">No files yet.</div>` : ""}
            ${(legal.attachments || []).map((f) => `
              <div class="note-item">
                <span class="note-text" style="flex:1">
                  ${esc(f.name)} <span style="color:#7A7274;font-size:11px">(${fmtFileSize(f.size)} · ${fmtDate(f.uploadedDate)})</span>
                </span>
                <button class="backup-btn" style="padding:4px 8px" onclick="downloadFile('${f.path}')">${ICONS.download}</button>
                <button class="step-delete" onclick="deleteLegalFile('${p.id}','${f.id}','${f.path}')">${ICONS.x}</button>
              </div>
            `).join("")}
          </div>
        </div>
        `}

        <div class="action-row">
          <button class="btn-ghost" onclick="generateProspectPDF('${p.id}')">${ICONS.download} PDF Report</button>
          ${isActive ? `
            <button class="btn-won" onclick="setStatus('${p.id}','won')">Mark Won</button>
            <button class="btn-lost" onclick="setStatus('${p.id}','lost')">Mark Lost</button>
          ` : `
            <button class="btn-reopen" onclick="setStatus('${p.id}','active')">${ICONS.reopen} Reopen</button>
          `}
          <div class="spacer"></div>
          ${state.confirmDeleteId === p.id ? `
            <span class="confirm-text">Delete this prospect?</span>
            <button class="btn-lost" onclick="deleteProspect('${p.id}')">Confirm</button>
            <button class="btn-ghost" onclick="state.confirmDeleteId=null; render()">Cancel</button>
          ` : `
            <button class="btn-delete" onclick="state.confirmDeleteId='${p.id}'; render()">${ICONS.trash}</button>
          `}
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="card-bar" style="background:${barColor}"></div>
      <div class="card-body">
        <button class="card-header" onclick="state.expandedId = state.expandedId === '${p.id}' ? null : '${p.id}'; render()">
          <div class="card-header-left">
            <span class="company-name">${esc(p.companyName)}</span>
            <span class="badge">${esc(p.channel)}</span>
            <span class="badge" style="color:${barColor};border-color:${barColor}">${p.salesPotential} potential</span>
            ${p.annualPotential ? `<span class="dollar-badge">${fmtCurrency(p.annualPotential)}/yr</span>` : ""}
          </div>
          <div class="card-header-right">
            ${isActive
              ? `<span class="next-contact ${overdue ? "overdue" : ""}">${ICONS.calendar} Next: ${p.nextContactDate ? fmtDate(p.nextContactDate) : "No date set"}</span>`
              : `<span class="next-contact">Closed ${fmtDate(p.closedDate)}</span>`
            }
            <span class="chevron ${expanded ? "open" : ""}">${ICONS.chevron}</span>
          </div>
        </button>
        ${detail}
      </div>
    </div>
  `;
}

function renderBoard() {
  const effectiveSort = state.sortBy || (state.tab === "active" ? "nextcontact" : "closeddate");
  const filtered = sortProspects(
    state.prospects.filter((p) => p.status === state.tab),
    effectiveSort
  );

  const counts = {
    active: state.prospects.filter((p) => p.status === "active").length,
    won: state.prospects.filter((p) => p.status === "won").length,
    lost: state.prospects.filter((p) => p.status === "lost").length,
    actionitems: state.prospects.reduce((n, p) => n + (p.actionSteps || []).filter((s) => !s.done).length, 0),
  };

  let saveStatus = "";
  if (state.saving) saveStatus = `<div class="save-status">Saving…</div>`;
  else if (state.saveError) saveStatus = `<div class="save-status error">Couldn't save changes (${esc(state.saveError)}) — they may be lost on refresh. <button class="retry-link" onclick="doSave()">Retry now</button></div>`;

  return `
    <div class="page">
      <div class="header-title-row">${ICONS.flame}<h1 class="title">Prospect Pipeline</h1></div>
      <p class="subtitle">Stoll Industries · Sales Tracker</p>
      <p class="shared-notice">Shared board — sign in with your account. Signed in as ${esc(state.currentUser ? state.currentUser.displayName : "")}.</p>
      <div class="backup-row">
        <button class="backup-btn" onclick="exportData()" ${state.prospects.length === 0 ? "disabled" : ""}>${ICONS.download} Export backup</button>
        <button class="backup-btn" onclick="document.getElementById('fileInput').click()">${ICONS.upload} Import backup</button>
        <button class="backup-btn" onclick="state.showImport = !state.showImport; render()">Paste JSON</button>
        <button class="backup-btn" onclick="signOutBoard()">Lock board</button>
        <input id="fileInput" type="file" accept="application/json" style="display:none" onchange="handleFileImport(event)" />
      </div>
      ${state.showImport ? `
        <div class="import-panel">
          <textarea class="textarea" rows="4" placeholder="Paste exported JSON here…"
            oninput="state.importText = this.value">${esc(state.importText)}</textarea>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn-primary" onclick="applyImport(state.importText)">${ICONS.check} Restore this data</button>
            <button class="btn-ghost" onclick="state.showImport=false; state.importText=''; state.importError=''; render()">Cancel</button>
          </div>
          ${state.importError ? `<div class="import-error">${esc(state.importError)}</div>` : ""}
        </div>
      ` : ""}

      <div class="tab-bar">
        ${["active", "won", "lost", "actionitems"].map((t) => `
          <button class="tab-btn ${state.tab === t ? "active" : ""}" onclick="state.tab='${t}'; state.expandedId=null; render()">
            ${STATUS_LABEL[t]} <span class="tab-count">${counts[t]}</span>
          </button>
        `).join("")}
        <button class="tab-btn ${state.tab === "reports" ? "active" : ""}" onclick="state.tab='reports'; state.expandedId=null; render()">
          Reports
        </button>
        <div class="spacer"></div>
        ${["active", "won", "lost"].includes(state.tab) ? `
          <select class="input sort-select" title="Sort by" onchange="state.sortBy = this.value; render()">
            ${SORT_OPTIONS.map((o) => `<option value="${o.id}" ${effectiveSort === o.id ? "selected" : ""}>Sort: ${o.label}</option>`).join("")}
          </select>
        ` : ""}
        ${state.tab === "active" ? `
          <button class="add-btn" onclick="state.showAddForm = !state.showAddForm; render()">${ICONS.plus} Add Prospect</button>
        ` : ""}
        <button class="settings-btn ${state.tab === "settings" ? "active" : ""}" title="Settings"
          onclick="state.tab='settings'; state.expandedId=null; render()">${ICONS.gear}</button>
      </div>

      ${state.tab === "settings" ? renderSettings() : state.tab === "actionitems" ? renderActionItems() : state.tab === "reports" ? renderReports() : `
        ${state.showAddForm ? `
          <div class="add-form">
            <input id="newNameInput" class="input" placeholder="Company name" value="${esc(state.newName)}"
              oninput="state.newName=this.value" onkeydown="if(event.key==='Enter'){addProspect()}" />
            <select class="input" onchange="state.newChannel=this.value">
              ${CHANNELS.map((c) => `<option value="${esc(c)}" ${state.newChannel === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
            </select>
            <button class="btn-primary" onclick="addProspect()">${ICONS.check} Save</button>
            <button class="btn-ghost" onclick="state.showAddForm=false; render()">${ICONS.x}</button>
          </div>
        ` : ""}

        ${!state.loaded ? `<div class="empty">Loading pipeline…</div>` : ""}

        ${state.loaded && filtered.length === 0 ? `
          <div class="empty">
            ${state.prospects.length === 0 && state.tab === "active"
              ? `<div>No prospects saved to this board yet.</div><button class="btn-ghost" style="margin-top:10px" onclick="loadSampleData()">Load sample data</button>`
              : state.tab === "active" ? "No active prospects yet. Add one to start tracking." : `No ${STATUS_LABEL[state.tab].toLowerCase()} prospects yet.`}
          </div>
        ` : ""}

        <div class="list">${filtered.map(renderCard).join("")}</div>
        ${saveStatus}
      `}
    </div>
  `;
}

const REPORTS = [
  {
    id: "active-overview",
    title: "Active Prospects Overview",
    description: "One table of every active prospect — name, channel, sales potential, sales $/year, and launch goal.",
    fn: "generateActiveProspectsReport",
  },
];

function renderReports() {
  return `
    <div class="settings-panel">
      <div class="section-label">Available Reports</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-top:-2px;margin-bottom:14px">
        More report types can be added here over time.
      </div>
      <div class="report-list">
        ${REPORTS.map((r) => `
          <div class="report-card">
            <div>
              <div class="report-card-title">${esc(r.title)}</div>
              <div class="report-card-desc">${esc(r.description)}</div>
            </div>
            <button class="btn-primary" onclick="${r.fn}()">${ICONS.download} Generate PDF</button>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function renderActionItems() {
  const groups = state.prospects
    .map((p) => ({
      prospect: p,
      steps: (p.actionSteps || [])
        .filter((s) => !s.done)
        .sort((a, b) => (a.dueDate || "9999").localeCompare(b.dueDate || "9999")),
    }))
    .filter((g) => g.steps.length > 0)
    .sort((a, b) => {
      const aDue = a.steps[0].dueDate || "9999";
      const bDue = b.steps[0].dueDate || "9999";
      return aDue.localeCompare(bDue);
    });

  if (groups.length === 0) {
    return `<div class="empty">No open action items across any prospects.</div>`;
  }

  return `
    <div class="action-items-groups">
      ${groups.map((g) => `
        <div class="action-items-group">
          <button class="action-items-group-header" onclick="state.tab='${g.prospect.status}'; state.expandedId='${g.prospect.id}'; render()">
            <span class="company-name">${esc(g.prospect.companyName)}</span>
            <span class="badge">${esc(g.prospect.channel)}</span>
            ${g.prospect.status !== "active" ? `<span class="badge">${STATUS_LABEL[g.prospect.status]}</span>` : ""}
            <span class="tab-count">${g.steps.length}</span>
          </button>
          <div class="step-list" style="margin-top:8px">
            ${g.steps.map((s) => {
              const overdueStep = s.dueDate && s.dueDate < todayISO();
              return `
              <div class="step-item">
                <button class="step-checkbox" onclick="toggleActionStep('${g.prospect.id}','${s.id}')">${ICONS.square}</button>
                <input class="input step-text-input" value="${esc(s.text)}"
                  onchange="updateActionStepText('${g.prospect.id}','${s.id}', this.value)" />
                ${s.addedBy ? `<span class="step-by" title="Added by ${esc(s.addedBy)}">${esc(s.addedBy)}</span>` : ""}
                <input class="input step-due-input ${overdueStep ? "overdue" : ""}" type="date" title="Due date"
                  value="${s.dueDate || ""}"
                  onchange="updateActionStepDueDate('${g.prospect.id}','${s.id}', this.value)" />
                <button class="step-delete" onclick="deleteActionStep('${g.prospect.id}','${s.id}')">${ICONS.x}</button>
              </div>
            `;
            }).join("")}
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderSettings() {
  const themes = [
    { id: "dark", label: "Dark", swatches: ["#1C1A1B", "#262324", "#9F1C34"] },
    { id: "gray", label: "In-between", swatches: ["#484546", "#565355", "#9F1C34"] },
    { id: "light", label: "Light", swatches: ["#F7F3F1", "#FFFFFF", "#9F1C34"] },
  ];
  return `
    <div class="settings-panel">
      <div class="section-label">Appearance</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-top:-2px;margin-bottom:4px">
        Color scheme is a per-device preference — everyone on the team can pick their own.
      </div>
      <div class="theme-grid">
        ${themes.map((t) => `
          <button class="theme-card ${state.theme === t.id ? "selected" : ""}" onclick="setTheme('${t.id}')">
            <div class="theme-swatch">${t.swatches.map((c) => `<span style="background:${c}"></span>`).join("")}</div>
            <div class="theme-card-label">${state.theme === t.id ? ICONS.check : ""} ${t.label}</div>
          </button>
        `).join("")}
      </div>

      ${state.currentUser && state.currentUser.isAdmin ? renderAdminUsers() : ""}
    </div>
  `;
}

function renderAdminUsers() {
  if (!state.adminUsersLoaded) {
    loadAdminUsers();
    return `<div class="section"><div class="section-label" style="margin-top:24px">Users</div><div class="empty-inline">Loading users…</div></div>`;
  }
  return `
    <div class="section" style="margin-top:24px">
      <div class="section-label">Users (admin only)</div>
      <div class="user-list">
        ${state.adminUsers.map((u) => `
          <div class="user-row">
            <div>
              <div class="user-name">${esc(u.displayName || u.email)} ${u.isAdmin ? `<span class="badge" style="margin-left:6px">Admin</span>` : ""}</div>
              <div class="user-email">${esc(u.email)}</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <button class="btn-ghost" onclick="setUserAdmin('${u.id}', ${!u.isAdmin})">${u.isAdmin ? "Remove admin" : "Make admin"}</button>
              <button class="btn-delete" title="Remove user" onclick="removeUser('${u.id}','${esc(u.email)}')">${ICONS.trash}</button>
            </div>
          </div>
        `).join("")}
      </div>

      ${state.adminError ? `<div class="import-error" style="margin-top:8px">${esc(state.adminError)}</div>` : ""}

      ${state.showInviteForm ? `
        <div class="add-form" style="margin-top:12px">
          <input class="input" placeholder="Name" value="${esc(state.inviteName)}" oninput="state.inviteName=this.value" />
          <input class="input" placeholder="Email" type="email" value="${esc(state.inviteEmail)}" oninput="state.inviteEmail=this.value" />
          <button class="btn-primary" onclick="submitInviteUser()">${ICONS.check} Send Invite</button>
          <button class="btn-ghost" onclick="state.showInviteForm=false; render()">${ICONS.x}</button>
        </div>
      ` : `
        <button class="add-btn" style="margin-top:12px" onclick="state.showInviteForm=true; state.adminError=''; render()">${ICONS.plus} Invite User</button>
      `}
    </div>
  `;
}

function render() {
  const root = document.getElementById("root");
  root.innerHTML = state.authenticated ? renderBoard() : renderGate();
}

function handleLoginSubmit() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  submitLogin(email, password);
}
function handleBootstrapSubmit() {
  const name = document.getElementById("bootstrapName").value;
  const email = document.getElementById("bootstrapEmail").value;
  const password = document.getElementById("bootstrapPassword").value;
  submitBootstrap(email, password, name);
}
function handleForgotSubmit() {
  const email = document.getElementById("forgotEmail").value;
  submitForgotPassword(email);
}
function handleSetNewPassword() {
  const pw = document.getElementById("newPasswordInput").value;
  const confirm = document.getElementById("newPasswordConfirm").value;
  if (!pw || pw.length < 6) {
    state.authError = "Password must be at least 6 characters.";
    render();
    return;
  }
  if (pw !== confirm) {
    state.authError = "Passwords don't match.";
    render();
    return;
  }
  submitNewPassword(pw);
}

// expose functions used by inline handlers
Object.assign(window, {
  updateProspect, updateContact, addNote, addActionStep, toggleActionStep, deleteActionStep,
  updateActionStepDueDate,
  deleteProspect, setStatus, addProspect, loadSampleData, exportData, handleFileImport,
  applyImport, doSave, state, render,
  handleFileSelect, downloadFile, deleteFile, setTheme, generateProspectPDF, generateActiveProspectsReport,
  startEditNote, cancelEditNote, saveEditNote, deleteNote, updateActionStepText,
  updateLegal, toggleLegalListValue, updateLegalRouting, generateLegalPDF,
  handleLegalFileSelect, deleteLegalFile,
  handleLoginSubmit, handleBootstrapSubmit, handleForgotSubmit, handleSetNewPassword, signOutBoard,
  loadAdminUsers, submitInviteUser, setUserAdmin, removeUser,
});

document.body.setAttribute("data-theme", state.theme);
render();
initAuth();
</script>
</body>
</html>
